name: Mileage
options:
  bundleIdPrefix: app.mileage
  deploymentTarget:
    iOS: "16.0"
targets:
  Mileage:
    type: application
    platform: iOS
    sources:
      - Mileage
    info:
      path: Mileage/Info.plist
      properties:
        CFBundleDisplayName: 走行距離ログ
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: 走行距離を GPS で測るために位置情報を使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を消しても走行距離を測り続けるために位置情報を使います。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mileage.log
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
